[package]
name = "jiff-chrono-conversions"
version = "0.0.2"
edition = "2024"
description = "Conversions between jiff and chrono types"
documentation = "https://docs.rs/jiff-chrono-conversions"
repository = "https://github.com/avsaase/jiff-chrono-conversions"
license = "MIT"
keywords = ["jiff", "chrono", "conversion"]
categories = ["date-and-time"]

# The property-based test suite lives in its own unpublished workspace member (`testsuite/`)
# rather than in this crate's `[dev-dependencies]`, because it needs `jiff`'s `arbitrary` feature,
# which isn't in a released version yet and would otherwise make this crate unpublishable.
[workspace]
members = ["examples/basic", "testsuite"]

[dependencies]
chrono_04 = { package = "chrono", version = "0.4", default-features = false, features = [
  "std"
], optional = true }
chrono_tz_010 = { package = "chrono-tz", version = "0.10.4", default-features = false, features = [
  "std",
], optional = true }
jiff_02 = { package = "jiff", version = "0.2", optional = true }
thiserror = "2.0.20"

[features]
default = ["chrono-04", "jiff-02"]
chrono-04 = ["dep:chrono_04"]
chrono-tz-010 = ["dep:chrono_tz_010"]
jiff-02 = ["dep:jiff_02"]

# Keeps `jiff` as the same package across both workspace members (rather than two separate copies
# from two different sources), so the testsuite crate's `jiff` types are the same types this
# crate's trait impls are written for. Only affects local builds within this workspace: `[patch]`
# is dropped when this crate is published or used as a dependency elsewhere, and `cargo publish`
# only resolves the package actually being published, so this doesn't affect publishability.
[patch.crates-io]
jiff = { git = "https://github.com/BurntSushi/jiff" }
