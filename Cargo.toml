[package]
name = "jiff-chrono-conversions"
version = "0.2.0"
edition = "2024"
description = "Conversions between jiff and chrono types"
documentation = "https://docs.rs/jiff-chrono-conversions"
repository = "https://github.com/avsaase/jiff-chrono-conversions"
license = "MIT"
keywords = ["chrono", "conversion", "jiff"]
categories = ["date-and-time"]

[workspace]
members = ["examples/basic"]

[dependencies]
chrono_04 = { package = "chrono", version = "0.4", default-features = false, features = [
  "std"
], optional = true }
chrono_tz_010 = { package = "chrono-tz", version = "0.10.4", default-features = false, features = [
  "std",
], optional = true }
jiff_02 = { package = "jiff", version = "0.2", optional = true }
jiff_10 = { package = "jiff", version = "1", optional = true }
thiserror = "2.0.20"

[features]
default = ["chrono-04", "jiff-10"]
chrono-04 = ["dep:chrono_04"]
chrono-tz-010 = ["dep:chrono_tz_010"]
jiff-02 = ["dep:jiff_02"]
jiff-10 = ["dep:jiff_10"]

[dev-dependencies]
arbitrary = "1.4"
chrono_04 = { package = "chrono", version = "0.4", default-features = false, features = [
  "arbitrary",
  "std",
] }
chrono_tz_010 = { package = "chrono-tz", version = "0.10.4", default-features = false }
jiff_02 = { package = "jiff", version = "0.2", features = [
  "arbitrary",
] }
jiff_10 = { package = "jiff", version = "1", features = [
  "arbitrary",
] }
proptest = "1.5"
proptest-arbitrary-interop = "0.1"

# Manually declared (rather than auto-discovered) so each suite only compiles when the crate
# features it tests are enabled.
[[test]]
name = "chrono04_jiff02_proptest"
required-features = ["chrono-04", "jiff-02"]

[[test]]
name = "chrono04_jiff10_proptest"
required-features = ["chrono-04", "jiff-10"]
